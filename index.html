<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Clone with Video Call</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="profile">My Chat</div>
      <ul class="contacts">
        <li class="active">Friend 1</li>
        <li>Friend 2</li>
        <li>Friend 3</li>
      </ul>
    </div>

    <!-- Chat Window -->
    <div class="chat">
      <div class="chat-header">
        Friend 1
        <button id="video-call-btn">📹 Video Call</button>
      </div>
      <div class="chat-body" id="chat-body">
        <div class="message received">Hello Bhavesh 👋</div>
        <div class="message sent">Hey! How are you?</div>
      </div>
      <div class="chat-footer">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <!-- Video Call Modal -->
  <div class="video-call" id="video-call">
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
    <button id="end-call-btn">End Call</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
